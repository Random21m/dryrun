# tools/release.conf: DRYRUN's details for tools/release.sh (the same script as every other project).
NAME=DRYRUN
REPO=Random21m/dryrun
SITE=https://random21m.github.io/dryrun
SITE_ROOT=
# SHA256SUMS is one line, for dryrun.html (the same as the SHA256SUMS file Claude commits at each freeze)
SITE_FILES=(dryrun.html)
VERSION_FILE=dryrun.html
VERSION_RE='<span id="drVersion">DRYRUN v[0-9.]*</span>'
CHECKS=("sw.js|const CACHE = 'dryrun-{V}';")
# attached to the release too, as before
ASSETS=(dryrun.html CID.txt)
